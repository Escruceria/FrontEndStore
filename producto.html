<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle de producto y formulario de compra de FrontEnd Store.">
    <title>ReactJS - FrontEnd Store</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Encabezado principal con enlace de regreso a la tienda. -->
    <header class="header">
        <a href="index.html">
            <img class="header__logo" src="img/logo.png" alt="Logotipo de FrontEnd Store">
        </a>
    </header>

    <!-- Navegación principal del sitio. -->
    <nav class="navegacion">
        <a class="navegacion__enlace navegacion__enlace--activo" href="index.html">Tienda</a>
        <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        <a class="navegacion__enlace" href="carrito.html">Carrito</a>
    </nav>

    <main class="contenedor">
        <h1>ReactJS</h1>

        <!-- Detalle del producto seleccionado y formulario de compra. -->
        <div class="camisa">
            <img class="camisa__imagen" src="img/3.jpg" alt="Camiseta de ReactJS">

            <div class="camisa__contenido">
                <p>Camiseta de ReactJS con diseño moderno, tela cómoda y estampado resistente. Ideal para quienes disfrutan crear interfaces dinámicas y llevar su tecnología favorita a todas partes.</p>

                <form class="formulario" id="formulario-carrito" action="#" method="post" data-nombre="ReactJS" data-precio="25" data-imagen="img/3.jpg">
                    <select class="formulario__campo" name="talla" aria-label="Seleccionar talla" required>
                        <option value="" disabled selected>-- Seleccionar talla --</option>
                        <option value="Chica">Chica</option>
                        <option value="Mediana">Mediana</option>
                        <option value="Grande">Grande</option>
                    </select>
                    <input class="formulario__campo" type="number" name="cantidad" placeholder="Cantidad" min="1" aria-label="Cantidad" required>
                    <input class="formulario__submit" type="submit" value="Agregar al carrito">
                </form>
            </div>
        </div>
    </main>

    <!-- Pie de página común en todas las vistas. -->
    <footer class="footer">
        <p class="footer__texto">Front End Store - Todos los derechos reservados 2026.</p>
    </footer>

    <script src="js/app.js"></script>
    
</body>
</html>
